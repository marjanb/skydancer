<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skydancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <sky-dancer id="dancer"></sky-dancer>
    <button type="button" id="restore" hidden>Show the dancer</button>
  </div>

  <form id="controls">
    <header>
      <div>
        <h1>Skydancer</h1>
        <p>Tweak it, poke it, then copy the embed code.</p>
      </div>
      <button type="button" id="randomize" class="secondary" title="Randomize every setting">Randomize</button>
    </header>

    <section>
      <h2>Look</h2>
      <div class="colors">
        <div class="swatch">
          <label class="color"><input type="color" data-key="color"><span>Body</span></label>
          <input type="text" class="hex" aria-label="Body colour hex" maxlength="7" spellcheck="false" autocomplete="off">
        </div>
        <div class="swatch">
          <label class="color"><input type="color" data-key="accent"><span>Arms &amp; hair</span></label>
          <input type="text" class="hex" aria-label="Arms and hair colour hex" maxlength="7" spellcheck="false" autocomplete="off">
        </div>
      </div>
      <label class="field"><span class="head">Height<output></output></span><input type="range" data-key="height" min="0.4" max="0.88" step="0.01"></label>
      <label class="field"><span class="head">Girth<output></output></span><input type="range" data-key="girth" min="30" max="110" step="1"></label>
      <label class="field"><span class="head">Arm length<output></output></span><input type="range" data-key="arm-length" min="0.15" max="0.5" step="0.01"></label>
      <label class="field"><span class="head">Face</span>
        <select data-key="face">
          <option value="happy">Happy</option>
          <option value="surprised">Surprised</option>
          <option value="cool">Cool</option>
        </select>
      </label>
      <label class="toggle"><span>Hair</span><input type="checkbox" data-key="hair"></label>
    </section>

    <section>
      <h2>Motion</h2>
      <label class="field"><span class="head">Speed<output></output></span><input type="range" data-key="speed" min="0.2" max="2.5" step="0.05"></label>
      <label class="field"><span class="head">Wildness<output></output></span><input type="range" data-key="wildness" min="0.2" max="2" step="0.05"></label>
      <label class="field"><span class="head">Wind<output></output></span><input type="range" data-key="wind" min="0" max="1.5" step="0.05"></label>
      <label class="field"><span class="head">Dancers<output></output></span><input type="range" data-key="count" min="1" max="6" step="1"></label>
    </section>

    <section>
      <h2>Text</h2>
      <label class="field"><span class="head">Speech bubble</span>
        <input type="text" data-key="sign" placeholder="Sale!" autocomplete="off">
      </label>
      <label class="field"><span class="head">Bubble shape</span>
        <select data-key="bubble">
          <option value="drawn">Hand drawn</option>
          <option value="box">Box</option>
          <option value="burst">Burst</option>
        </select>
      </label>
      <label class="toggle"><span>Close button</span><input type="checkbox" data-key="closable"></label>
    </section>

    <section>
      <h2>Embed</h2>
      <label class="field"><span class="head">Dancer height <span class="hint">px</span></span>
        <input type="number" id="dancer-size" min="80" max="1200" step="10" value="400">
      </label>
      <label class="field"><span class="head">Script <span class="hint">once per page</span></span>
        <textarea id="embed-script" rows="3" readonly spellcheck="false"></textarea>
      </label>
      <button type="button" id="copy-script" class="secondary">Copy script</button>
      <label class="field"><span class="head">Tag <span class="hint">paste one to load it</span></span>
        <textarea id="embed-tag" rows="5" spellcheck="false"></textarea>
      </label>
      <button type="button" id="copy-tag">Copy tag</button>
      <button type="button" id="hide" class="secondary">Hide the dancer</button>
    </section>
  </form>

  <script src="skydancer.js"></script>
  <script src="customizer.js"></script>
</body>
</html>
