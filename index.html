<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skydancer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <sky-dancer id="dancer"></sky-dancer>

  <form id="controls">
    <h1>Skydancer</h1>
    <label>Body color <input type="color" data-key="color"></label>
    <label>Arms &amp; hair color <input type="color" data-key="accent"></label>
    <label>Height <input type="range" data-key="height" min="0.4" max="0.85" step="0.01"></label>
    <label>Girth <input type="range" data-key="girth" min="30" max="110" step="1"></label>
    <label>Arm length <input type="range" data-key="arm-length" min="0.15" max="0.5" step="0.01"></label>
    <label>Speed <input type="range" data-key="speed" min="0.2" max="2.5" step="0.05"></label>
    <label>Wildness <input type="range" data-key="wildness" min="0.2" max="2" step="0.05"></label>
    <label>Wind <input type="range" data-key="wind" min="0" max="1.5" step="0.05"></label>
    <label>Face
      <select data-key="face">
        <option value="happy">Happy</option>
        <option value="surprised">Surprised</option>
        <option value="cool">Cool</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" data-key="hair"> Hair</label>
    <button type="button" id="randomize">Randomize</button>
    <label>Embed code
      <textarea id="embed-code" rows="6" readonly></textarea>
    </label>
    <button type="button" id="copy-embed">Copy embed code</button>
  </form>

  <script src="skydancer.js"></script>
  <script src="customizer.js"></script>
</body>
</html>
