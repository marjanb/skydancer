<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skydancer</title>
  <meta name="description" content="Build an inflatable tube dancer for your page, then copy the two lines that put it there. No dependencies, no build step.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&family=Nunito:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <sky-dancer id="dancer"></sky-dancer>

    <!-- What changed, for a reader who cannot see it change. Polite: it is a
         confirmation, never an interruption. -->
    <p id="said" role="status" class="offscreen"></p>

    <div id="stage-bar">
      <span id="stage-hint">Grab them and drag them about</span>
      <button type="button" id="hide" class="ghost">Hide</button>
      <button type="button" id="restore" class="ghost" hidden>Bring them back</button>
    </div>
  </main>

  <form id="controls">
    <header id="panel-head">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 21c0-7 5-6.5 5-12.5V4"/>
            <path d="M9.8 14.2c-2.2.2-3.6 1.5-4.3 3"/>
            <path d="M14.3 9.8c2.2.2 3.8-.7 4.7-2.1"/>
          </svg>
        </span>
        <h1>Skydancer</h1>
        <button type="button" id="randomize" class="ghost" title="Randomize every setting">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/>
            <path d="m18 2 4 4-4 4"/>
            <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
            <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
            <path d="m18 14 4 4-4 4"/>
          </svg>
          Surprise me
        </button>
        <a class="ghost icon" id="source" href="https://github.com/marjanb/skydancer"
           target="_blank" rel="noopener" title="The code, on GitHub" aria-label="The code, on GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56 0-.28-.01-1.01-.02-1.98-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.3-.52-1.47.11-3.07 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.6.23 2.77.12 3.07.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.2.67.79.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/>
          </svg>
        </a>
      </div>
      <div class="tagline">
        <p>Dress them up, then take them home.</p>
        <div class="steps">
          <button type="button" id="undo" class="ghost icon" title="Nothing to step back to" aria-label="Step back" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14 4 9l5-5"/>
              <path d="M4 9h10a6 6 0 0 1 0 12h-3"/>
            </svg>
          </button>
          <button type="button" id="redo" class="ghost icon" title="Nothing to step forward to" aria-label="Step forward" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 14 5-5-5-5"/>
              <path d="M20 9H10a6 6 0 0 0 0 12h3"/>
            </svg>
          </button>
          <button type="button" id="reset" class="ghost icon" title="Back to the default dancer" aria-label="Reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 2.6-6.4"/>
              <path d="M3 4v5h5"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="panel-body">
      <div class="presets">
        <span class="presets-label">Start from</span>
        <button type="button" class="chip" data-preset="yard">Car yard</button>
        <button type="button" class="chip" data-preset="shop">Shop front</button>
        <button type="button" class="chip" data-preset="party">Party</button>
        <button type="button" class="chip" data-preset="night">Late night</button>
      </div>

      <section class="card look" aria-labelledby="look-head">
        <h2 id="look-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          Looks
        </h2>
        <div class="colors">
          <div class="swatch">
            <label class="color"><input type="color" data-key="color"><span>Body</span></label>
            <input type="text" class="hex" aria-label="Body colour hex" maxlength="7" spellcheck="false" autocomplete="off">
          </div>
          <div class="swatch">
            <label class="color"><input type="color" data-key="accent"><span>Arms &amp; hair</span></label>
            <input type="text" class="hex" aria-label="Arms and hair colour hex" maxlength="7" spellcheck="false" autocomplete="off">
          </div>
        </div>
        <label class="field"><span class="head">Girth<output></output></span><input type="range" data-key="girth" min="30" max="110" step="1"></label>
        <label class="field"><span class="head">Arm length<output></output></span><input type="range" data-key="arm-length" min="0.15" max="0.5" step="0.01"></label>
        <label class="field"><span class="head">Face</span>
          <select data-key="face">
            <option value="happy">Happy</option>
            <option value="surprised">Surprised</option>
            <option value="cool">Cool</option>
            <option value="wink">Wink</option>
            <option value="joy">Joy</option>
            <option value="sleepy">Sleepy</option>
            <option value="angry">Angry</option>
          </select>
        </label>
        <label class="field"><span class="head">Markings</span>
          <select data-key="pattern">
            <option value="none">Plain</option>
            <option value="rings">Rings</option>
            <option value="spiral">Spiral</option>
            <option value="dots">Dots</option>
            <option value="chevrons">Chevrons</option>
          </select>
        </label>
        <label class="field"><span class="head">Glow</span>
          <select data-key="glow">
            <option value="none">Unlit</option>
            <option value="on">Lit</option>
          </select>
        </label>
        <label class="toggle"><span>Hair</span><input type="checkbox" data-key="hair"></label>
        <label class="toggle"><span>Worn</span><input type="checkbox" data-key="worn"></label>
      </section>

      <section class="card motion" aria-labelledby="motion-head">
        <h2 id="motion-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/>
          </svg>
          Wiggle
        </h2>
        <label class="field"><span class="head">Speed<output></output></span><input type="range" data-key="speed" min="0.2" max="2.5" step="0.05"></label>
        <label class="field"><span class="head">Wildness<output></output></span><input type="range" data-key="wildness" min="0.2" max="2" step="0.05"></label>
        <label class="field"><span class="head">Wind<output></output></span><input type="range" data-key="wind" min="0" max="1.5" step="0.05"></label>
        <label class="field"><span class="head"><span>Opening hours <span class="hint">flat outside them</span></span></span>
          <input type="text" data-key="hours" placeholder="9-17" autocomplete="off" spellcheck="false">
        </label>
      </section>

      <section class="card talk" aria-labelledby="talk-head">
        <h2 id="talk-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
          </svg>
          Chatter
        </h2>
        <label class="field"><span class="head">Speech bubble</span>
          <input type="text" data-key="sign" placeholder="Sale! | Open late | Come in" autocomplete="off">
        </label>
        <label class="field"><span class="head">Bubble shape</span>
          <select data-key="bubble">
            <option value="drawn">Hand drawn</option>
            <option value="round">Oval</option>
            <option value="box">Box</option>
            <option value="cloud">Cloud</option>
            <option value="burst">Burst</option>
          </select>
        </label>
        <label class="field"><span class="head"><span>Printed <span class="hint">down the body</span></span></span>
          <input type="text" data-key="print" placeholder="SALE" autocomplete="off" maxlength="24">
        </label>
        <label class="field"><span class="head"><span>Placard <span class="hint">a board at their feet</span></span></span>
          <input type="text" data-key="placard" placeholder="Open till 8" autocomplete="off">
        </label>
        <label class="field"><span class="head"><span>When poked <span class="hint">what it blurts</span></span></span>
          <input type="text" data-key="shout" placeholder="Oi! | Hey | Over here" autocomplete="off" maxlength="40">
        </label>
        <label class="field"><span class="head"><span>Link <span class="hint">where a click leads</span></span></span>
          <input type="url" data-key="href" placeholder="https://example.com" autocomplete="off" spellcheck="false">
        </label>
      </section>

      <section class="card embed" aria-labelledby="embed-head">
        <h2 id="embed-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>
          </svg>
          Take them home
        </h2>
        <label class="field"><span class="head"><span>Dancer height <span class="hint">px</span></span></span>
          <input type="number" id="dancer-size" min="80" max="1200" step="10" value="400">
        </label>
        <div class="field">
          <div class="head"><span>Link <span class="hint">send this dancer to someone</span></span>
            <button type="button" id="copy-link" class="chip">Copy</button>
          </div>
          <textarea id="share-link" rows="2" readonly spellcheck="false" aria-label="Link to this dancer"></textarea>
        </div>
        <div class="field">
          <div class="head"><span>Script <span class="hint" id="script-hint">once per page</span></span>
            <span class="head-chips">
              <span role="group" aria-label="How to load it">
                <button type="button" class="chip" data-source="cdn" aria-pressed="true">CDN</button>
                <button type="button" class="chip" data-source="npm" aria-pressed="false">npm</button>
              </span>
              <button type="button" id="copy-script" class="chip">Copy</button>
            </span>
          </div>
          <textarea id="embed-script" rows="3" readonly spellcheck="false" aria-label="Embed script"></textarea>
        </div>
        <div class="field">
          <div class="head"><span>Tag <span class="hint">paste one to load it</span></span>
            <button type="button" id="copy-tag" class="chip">Copy</button>
          </div>
          <textarea id="embed-tag" rows="5" spellcheck="false" aria-label="Embed tag"></textarea>
        </div>
      </section>
    </div>
  </form>

  <script src="skydancer.js"></script>
  <script src="customizer.js"></script>
</body>
</html>
